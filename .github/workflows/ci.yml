name: CI

# The written form of what `mix precommit` already does locally, so the two
# cannot drift into disagreeing about what "green" means.
on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer worthless.
# Cancel it rather than queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a commit SHA rather than a tag: whoever controls the
# action's repository can move a tag onto different code, and it would run here
# with whatever secrets this workflow has.
#
# The cost of that, learned the hard way: a SHA freezes the version, and a frozen
# version eventually stops understanding its runner. These were pinned at
# setup-beam v1.9.0, which predates `ubuntu-latest` becoming ubuntu-24 and failed
# with "Tried to map a target OS from env. variable 'ImageOS' (got ubuntu24)".
# Pin to a *current* release, and bump these deliberately — the trailing comments
# are there so the versions are readable at a glance.

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.20.2"
  OTP_VERSION: "29.0.4"

# Two jobs, not one: the linters need no database and the tests need no
# advisory feed, so running them side by side costs the wall clock of the
# slower one instead of the sum. They share the same dependency cache.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # The compiler version is part of the key: build artifacts from another
      # Elixir are not a warm cache, they are a confusing failure.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get

      # Cheapest first, so a misformatted file does not wait on a compile.
      - run: mix format --check-formatted

      - run: mix deps.unlock --check-unused

      # Advisories published after the lockfile was written. Fails the build so
      # the news arrives here rather than in an audit.
      - run: mix hex.audit

      # Warnings become errors here and nowhere else, which is the point: the
      # editor is free to be noisy while you work.
      - run: mix compile --warnings-as-errors

      - run: mix credo

      - run: mix sobelow

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: estoque_os_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get

      # A translation that was never extracted must not ship. Merging pulls any
      # new string into the .po with an empty translation, where
      # gettext_test.exs fails on it by name — so the gate names the missing
      # string instead of complaining about line numbers, which is what
      # `--check-up-to-date` would do every time `format` moved a call.
      - run: mix gettext.extract --merge

      - run: mix test
        env:
          # The service container publishes on the default port; local dev uses
          # 5433, so the two configurations must not assume each other.
          PGPORT: 5432
